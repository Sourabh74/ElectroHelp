<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6f2" />
    <title>Current — Home electrical help</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#" aria-label="Current home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none">
              <path d="M18.3 3.5 8 17h7l-1.3 11.5L24 14.8h-7l1.3-11.3Z" fill="currentColor" />
            </svg>
          </span>
          <span>ElectroHelp<span class="brand-period">.</span></span>
        </a>

        <div class="sidebar-label">WORKSPACE</div>
        <nav class="main-nav" aria-label="Main navigation">
          <button class="nav-link active" data-view="home">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10Z" /></svg>
            <span>Overview</span>
          </button>
          <button class="nav-link" data-view="requests">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10l3 3v15H4V3h3Zm0 0v4h10V3M8 12h8m-8 4h8" /></svg>
            <span>My requests</span>
            <span class="nav-count hidden" id="nav-count">0</span>
          </button>
        </nav>

        <div class="sidebar-bottom">
          <div class="help-card">
            <div class="help-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 18h.01M9.1 9a3 3 0 1 1 5.2 2c-1.1 1-2.3 1.4-2.3 3" /><circle cx="12" cy="12" r="9" /></svg>
            </div>
            <p>Need a hand?</p>
            <span>We’re here if you need us.</span>
            <a href="mailto:hello@current.example">Get in touch <span aria-hidden="true">↗</span></a>
          </div>
          <button class="profile-button" id="profile-button" type="button" aria-label="Sign in">
            <span class="avatar" id="user-avatar">?</span>
            <span class="profile-copy"><strong id="user-name">Welcome</strong><small id="user-role">Sign in to get started</small></span>
            <svg class="profile-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4" /></svg>
          </button>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="breadcrumb"><span>Workspace</span><span class="crumb-divider">/</span><strong id="page-crumb">Overview</strong></div>
          <div class="topbar-actions">
            <button class="icon-button notification-button" id="notification-button" type="button" aria-label="Notifications">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-8 12h4" /></svg>
              <span class="notification-dot hidden" id="notification-dot"></span>
            </button>
            <span class="top-avatar" id="top-avatar">?</span>
          </div>
        </header>

        <section class="content-wrap" id="app-view" aria-live="polite"></section>
      </main>
    </div>
    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
  </body>
</html>
